<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeyard 作业场</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto max-w-5xl px-6 py-12">
    <p class="text-xs uppercase tracking-[0.35em] text-amber-400">Deterministic DAG Yard</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight">Pipeyard</h1>
    <p class="mt-3 text-zinc-400">把作业拆成有向无环图，阶段在本机执行，SQLite 与 WAL 保证重启可恢复。</p>
    <section class="mt-10 grid gap-4 md:grid-cols-4">
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">
        <p class="text-zinc-500 text-sm">健康</p>
        <p id="health" class="mt-2 text-2xl font-medium">...</p>
      </div>
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">
        <p class="text-zinc-500 text-sm">作业</p>
        <p id="jobs" class="mt-2 text-2xl font-medium">-</p>
      </div>
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">
        <p class="text-zinc-500 text-sm">已提交</p>
        <p id="sub" class="mt-2 text-2xl font-medium">-</p>
      </div>
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-5">
        <p class="text-zinc-500 text-sm">已完成节点</p>
        <p id="done" class="mt-2 text-2xl font-medium">-</p>
      </div>
    </section>
    <section class="mt-8 grid gap-6 md:grid-cols-2">
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-6">
        <h2 class="text-lg font-medium">提交两节点作业</h2>
        <label class="mt-4 block text-sm text-zinc-400">名称</label>
        <input id="name" class="mt-2 w-full rounded-xl bg-zinc-950 border border-zinc-700 px-4 py-2" value="demo" />
        <label class="mt-4 block text-sm text-zinc-400">校验正文</label>
        <input id="body" class="mt-2 w-full rounded-xl bg-zinc-950 border border-zinc-700 px-4 py-2" value="hello pipeyard" />
        <div class="mt-4 flex gap-3">
          <button id="submit" class="rounded-xl bg-amber-400 px-4 py-2 text-zinc-950 font-medium">提交</button>
          <button id="tick" class="rounded-xl border border-zinc-600 px-4 py-2">推进 1</button>
        </div>
      </div>
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-6">
        <h2 class="text-lg font-medium">账本</h2>
        <pre id="out" class="mt-4 overflow-auto text-xs text-amber-100/90 min-h-[10rem]"></pre>
      </div>
    </section>
  </main>
  <script>
    const out = document.getElementById('out');
    async function refresh() {
      const h = await fetch('/health').then(r => r.json());
      document.getElementById('health').textContent = h.status || 'down';
      const s = await fetch('/v1/stats').then(r => r.json());
      document.getElementById('jobs').textContent = s.Jobs ?? '-';
      document.getElementById('sub').textContent = (s.Metrics && s.Metrics.Submitted) ?? '-';
      document.getElementById('done').textContent = (s.Metrics && s.Metrics.Completed) ?? '-';
      const jobs = await fetch('/v1/jobs').then(r => r.json());
      out.textContent = JSON.stringify(jobs, null, 2);
    }
    document.getElementById('submit').onclick = async () => {
      const name = document.getElementById('name').value;
      const body = document.getElementById('body').value;
      const r = await fetch('/v1/jobs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name,
          nodes: [
            {ID: 'a', Kind: 'validate', Param: body},
            {ID: 'b', Kind: 'map', Param: 'out:'}
          ],
          edges: [{From: 'a', To: 'b'}]
        })
      });
      out.textContent = await r.text();
      refresh();
    };
    document.getElementById('tick').onclick = async () => {
      const r = await fetch('/v1/tick?n=1', {method: 'POST'});
      out.textContent = await r.text();
      refresh();
    };
    refresh();
  </script>
</body>
</html>
